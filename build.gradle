plugins {
    id 'java'
}

version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        // Source: https://mvnrepository.com/artifact/com.zeroc/ice
        implementation 'com.zeroc:ice:3.7.11'
        testImplementation platform('org.junit:junit-bom:6.0.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

// Genera build/dist/chat-server.jar y build/dist/chat-client.jar para copiarlos a otras maquinas
tasks.register('packageJars', Copy) {
    group = 'distribution'
    description = 'Builds the standalone server and client jars into build/dist'
    from(project(':server').tasks.named('jar'), project(':client').tasks.named('jar'))
    into layout.buildDirectory.dir('dist')
}

tasks.register('runServer') {
    group = 'application'
    description = 'Runs the chat server'
    dependsOn ':server:run'
}

tasks.register('runClient') {
    group = 'application'
    description = 'Runs the chat client'
    dependsOn ':client:run'
}